[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "a-maze-ing"
version = "0.1.0"
description = "A-Maze-ing maze generator and pathfinder project for 42 school"
authors = [
    {name = "borabi", email = "bilal.orabi@learner.42.tech"},
    {name = "hqasqas", email = "hamza.qasqas@learner.42.tech"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.10"
dependencies = []

[tool.poetry]
packages = [{ include = "mazegen" }]

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]

# Strict static type checking settings for 42 evaluation
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Flake8 configuration
[tool.flake8]
extend-ignore = "E203"
exclude = [".venv", "__pycache__", "build", "dist"]